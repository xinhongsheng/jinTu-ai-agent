spring:
  profiles:
    active: dev
  application:
    name: jinTu-ai-agent
server:
  port: 8123
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.jintu.jintuaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

